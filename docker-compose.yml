# Local PostgreSQL only. This is not a production deploy.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: control
      POSTGRES_PASSWORD: control
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control_plane"]
      interval: 5s
      timeout: 5s
      retries: 10
